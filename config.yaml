---
###############################################################################
#                                                                             #
#                            WEBSITE CONFIGURATION                            #
#                                                                             #
###############################################################################


# --- base website settings ---

title: Miqesi
baseURL: https://miqesi.org/
theme: toph
locale: en-us
enableEmoji: true
enableGitInfo: true
enableRobotsTXT: false
#googleAnalytics: TBD


# --- taxonomy and pagination settings ---

taxonomies:
  tag: tags
  category: categories
pagination:
  pagerSize: 10


# --- module mounts ---

module:
  mounts:
    # Keep unmanaged static files (favicon, robots.txt) where they are.
    - source: static
      target: static
    # Serve page assets at /pages/ while keeping them available to Hugo's
    # image processing pipeline (responsive WebP, fingerprinting).
    - source: assets/pages
      target: static/pages


# --- security settings ---

security:
  exec:
    allow: ['^dart-sass-embedded$', '^git$', '^go$', '^npx$', '^postcss$', '^asciidoctor$']


# --- markup settings ---

markup:
  asciidocExt:
    preserveTOC: true
  highlight:
    style: github


# --- privacy settings ---

privacy:
  googleAnalytics:
    anonymizeIP: true
    respectDoNotTrack: true
  x:
    enableDNT: true
  youtube:
    privacyEnhanced: true


# --- navigation menu ---

menu:
  nav:
    - identifier: home
      name: home
      pageRef: /
      weight: 10
    - identifier: team
      name: team
      pageRef: /team
      weight: 20
    - identifier: blog
      name: blog
      pageRef: /blog
      weight: 30
    - identifier: categories
      name: categories
      pageRef: /categories
      parent: blog
      weight: 40
    - identifier: tags
      name: tags
      pageRef: /tags
      parent: blog
      weight: 50


# --- custom settings ---

params:
  color_mode: auto
  biography:
    name: Miqesi
    tagline: ""
    email: "example@example.com"
    first_online: 2024
    knows_about: [
      "a11y",
      "accessibility",
      "diversity",
      "equity",
      "Fedora Project",
      "Free Software",
      "inclusion",
      "Linux",
      "open source",
      "Red Hat",
      "Red Hat Enterprise Linux (RHEL)",
      "RPM package management",
      "user experience"
    ]
  colors:
    light:
      primary: "#AD1457"
      secondary: "#F8F6F0"
      accent: "#33691E"
      background: "#F8F6F0"
    dark:
      primary: "#AD1457"
      secondary: "#F8F6F0"
      accent: "#33691E"
      background: "#121212"
  description: Home of Project Miqesi.
  fonts:
    default: Atkinson Hyperlegible Next
    default_weight: "400"
    title: Inter
    title_weight: "900"
    header: Inter
    header_weight: "700"
  hero:
    shape: square
  images:
    - /pages/logo.png
  favicon: /favicon.ico
  git_repo: https://github.com/miqesi/miqesi.org
  taxonomy_exclude: ["footer", "projects", "team"]
  hire_me: false
  social:
    github: miqesi
  legal:
    license:
      name: "MPL-2.0"
      url: "https://www.mozilla.org/en-US/MPL/2.0/"
      title: "Mozilla Public License 2.0"
  date_format: "2006 January 02"
  team:
    page_title: "Team"
  layouts:
    categories:
      recent_posts: 3
      excerpt_length: 250


# --- internationalization settings ---

defaultContentLang: en
languages:
  en:
    weight: 1
    label: English
