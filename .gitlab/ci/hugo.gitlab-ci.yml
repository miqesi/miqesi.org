---
hugo_build:
  image: cibuilds/hugo:latest
  stage: build

  # Cache HTMLProofer data across builds
  cache:
    paths:
      - tmp/.htmlproofer
      - themes/toph/exampleSite/tmp/.htmlproofer

  script:
    # build main site
    - HUGO_ENV=production hugo --verbose
    - htmlproofer public
        --allow-hash-href
        --check-favicon
        --check-html
        --check-img-http
        --empty-alt-ignore
        --enforce-https
        --internal-domains miqesi.org
        --http-status-ignore 0,400,503,999
        --url-ignore "/archive/v3/irc/,/spigotmc.org/"
        --timeframe 6w

  after_script: []

  artifacts:
    paths:
      - public
